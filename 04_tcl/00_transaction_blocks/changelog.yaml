# ============================================================
# CHANGELOG — 04_tcl/00_transaction_blocks
# Archivo: 04_tcl/00_transaction_blocks/changelog.yaml
# Descripción: Registra en Liquibase, con fines de control
#              de versión y documentación, los 7 bloques
#              transaccionales de negocio del sistema.
#
# ⚠️ IMPORTANTE: estos scripts usan marcadores parametrizados
# (:id_user, :id_home, :id_device, etc.) y están diseñados
# para ser invocados por el backend de la aplicación o
# ejecutados manualmente por un DBA, NO para correr
# automáticamente con cada `liquibase update`. Se marcan con
# runOnChange para que Liquibase los versiones sin bloquear
# el pipeline si cambian de contenido.
#
# Autor: Karen Daniela Holguín Cruz, Natalia Chala Chala,
#        Kevin Stiven López Amaya
# Institución: SENA — Análisis y Desarrollo de Software
# Ficha: 3145555
# Versión: 1.0.0
# Fecha: 2025
# ============================================================

databaseChangeLog:

  - changeSet:
      id: tcl-tx-001-registro-usuario
      author: smarthome-team
      comment: "[REFERENCIA] Bloque transaccional de registro de usuario (RF1.1)"
      runOnChange: true
      changes:
        - sqlFile:
            path: 001_tcl_registro_usuario.sql
            relativeToChangelogFile: true
            splitStatements: true
            stripComments: true

