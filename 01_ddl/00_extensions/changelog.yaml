databaseChangeLog:

  - changeSet:
      id: ddl-ext-001-uuid
      author: smarthome-team
      comment: Instala la extensión uuid-ossp
      changes:
        - sqlFile:
            path: 001_enable_uuid_extension.sql
            relativeToChangelogFile: true
            splitStatements: true
            stripComments: true

  - changeSet:
      id: ddl-ext-002-pgcrypto
      author: smarthome-team
      comment: Instala la extensión pgcrypto
      changes:
        - sqlFile:
            path: 002_enable_pgcrypto_extension.sql
            relativeToChangelogFile: true
            splitStatements: true
            stripComments: true