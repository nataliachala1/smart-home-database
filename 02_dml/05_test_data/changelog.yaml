databaseChangeLog:

  - changeSet:
      id: dml-test-data-001-usuarios
      author: smarthome-team
      comment: "[TEST-DATA] Inserta usuarios de prueba"
      context: test-data
      runOnChange: true
      changes:
        - sqlFile:
            path: 001_test_users.sql
            relativeToChangelogFile: true
            splitStatements: true
            stripComments: true

  - changeSet:
      id: dml-test-data-002-dispositivos
      author: smarthome-team
      comment: "[TEST-DATA] Inserta dispositivos de prueba"
      context: test-data
      runOnChange: true
      changes:
        - sqlFile:
            path: 003_test_devices.sql
            relativeToChangelogFile: true
            splitStatements: true
            stripComments: true
  
  